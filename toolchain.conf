# ==================================================================================================
# THE ONE EXTERNAL-TOOL RESOLUTION POLICY.
#
# This file IS the policy.  The three adapters — src/main/scala/Tools.scala, scripts/toolpath.sh and
# scripts/toolpath.py — READ it; none of them contains a tool name, an environment variable name or
# an install location of its own.  Change a tool here and all three change together; there is no
# generated file to go stale and no "twin" to drift.
#
# NO ABSOLUTE PATH IS COMPILED INTO THE TREE.  A tool is found by, in order:
#
#   1. its ENVIRONMENT OVERRIDE (the `env` key below) — either an absolute path, or a bare name
#      that is looked up on PATH;
#   2. $ZIPPY_TOOLS/<binary>, when $ZIPPY_TOOLS is set — the one place a machine declares where it
#      keeps provers that are not on PATH.  This replaces the former hardcoded
#      /usr/local/bin : /opt/homebrew/bin : ~/.local/bin : ~/.cargo/bin lists: a machine that
#      wants those searched puts them on PATH, or points $ZIPPY_TOOLS at one of them;
#   3. PATH.
#
# If none of the three resolves, the tool is ABSENT and every caller must SAY SO out loud rather
# than silently degrading (docs/traps.md §3: a semantics-critical path must never quietly become a
# no-op).  `search` below fixes the order and is honoured by all three adapters.
#
# The file's location may itself be overridden with $ZIPPY_TOOLCHAIN (an absolute path to a
# replacement policy file); otherwise each adapter looks for `toolchain.conf` beside the repo root.
# With the file absent the adapters fall back to `env, path` for a tool named exactly like its
# binary — i.e. the policy degrades to the two location-free steps, never to a hardcoded path.
# ==================================================================================================

search = env, zippy-tools, path

[z3]
binary       = z3
env          = Z3
version-flag = -version

[vampire]
binary       = vampire
env          = VAMPIRE
version-flag = --version

[egglog]
binary       = egglog
env          = EGGLOG
version-flag = --version
