# ==================================================================================================
# THE ONE EXTERNAL-TOOL RESOLUTION POLICY.
#
# This file IS the policy.  The three adapters — src/main/scala/Tools.scala, scripts/toolpath.sh and
# scripts/toolpath.py — READ it; none of them contains a tool name, an environment variable name or
# an install location of its own.  Change a tool here and all three change together; there is no
# generated file to go stale and no "twin" to drift.
#
# NO ABSOLUTE PATH IS COMPILED INTO THE TREE.  A tool is found by, in order:
#
#   1. its ENVIRONMENT OVERRIDE (the `env` key below) — either an absolute path, or a bare name
#      that is looked up on PATH;
#   2. $ZIPPY_TOOLS/<binary>, when $ZIPPY_TOOLS is set — the one place a machine declares where it
#      keeps provers that are not on PATH.  This replaces the former hardcoded
#      /usr/local/bin : /opt/homebrew/bin : ~/.local/bin : ~/.cargo/bin lists: a machine that
#      wants those searched puts them on PATH, or points $ZIPPY_TOOLS at one of them;
#   3. PATH;
#   4. ${ELAN_HOME:-~/.elan}/bin/<binary> — the `elan` step, for the LEAN toolchain only.
#
# WHY `elan` IS A STEP AND NOT A RETURN OF THE HARDCODED LISTS.  `lake` is not installed like the
# provers.  It is a SHIM that elan (Lean's toolchain multiplexer) places in its own root and that
# dispatches on the `lean-toolchain` file beside the package — so pointing $ZIPPY_TOOLS at a copy of
# `lake` would break the dispatch, and asking a machine to add it to PATH is asking it to duplicate
# what elan's own installer already wrote into ~/.profile.  `$ELAN_HOME` is elan's DOCUMENTED
# override for its root and `~/.elan` its documented default, so this step reads a location the
# machine declares, exactly as step 2 does; the tree still contains no absolute path.  It is LAST, so
# an explicit $LAKE or a PATH entry always wins.
#
# If none of the four resolves, the tool is ABSENT and every caller must SAY SO out loud rather
# than silently degrading (docs/traps.md §3: a semantics-critical path must never quietly become a
# no-op).  `search` below fixes the order and is honoured by all three adapters.
#
# The file's location may itself be overridden with $ZIPPY_TOOLCHAIN (an absolute path to a
# replacement policy file); otherwise each adapter looks for `toolchain.conf` beside the repo root.
# With the file absent the adapters fall back to `env, path` for a tool named exactly like its
# binary — i.e. the policy degrades to the two location-free steps, never to a hardcoded path.
# (That fallback deliberately omits `elan`: a tree without this file has no Lean development
# either, and a step that only exists in the file should not survive the file.)
# ==================================================================================================

search = env, zippy-tools, path, elan

[z3]
binary       = z3
env          = Z3
version-flag = -version

[vampire]
binary       = vampire
env          = VAMPIRE
version-flag = --version

[egglog]
binary       = egglog
env          = EGGLOG
version-flag = --version

# The publication reproducer creates a detached worktree and must export its test runtime before
# running gates.  Resolve sbt through the same policy as every other external tool instead of
# assuming that a non-interactive SSH shell happens to inherit an interactive PATH.
[sbt]
binary       = sbt
env          = SBT
version-flag = --script-version

# The Lean build driver for proofs/lean.  `scripts/check_lean.sh` runs
# `lake build` there and `sbt check` runs that as one of its gates, so a mechanized theorem that
# stops compiling is a red build rather than a stale claim in a status table.  Resolved by the same
# policy as the provers, with the `elan` step for the reason in this file's header.
[lake]
binary       = lake
env          = LAKE
version-flag = --version
